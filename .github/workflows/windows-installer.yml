name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # Path-filtered so packaging PRs can verify the installer without a matrix.
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/windows-installer.yml"
      - "scripts/generate_app_icon.py"
      - "scripts/build_windows.bat"
      - "pyproject.toml"

# Single job on windows-latest (no matrix) to keep CI minutes low.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        id: ver
        shell: bash
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Courier version: $VER"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]" Pillow

      - name: Generate app icon (.ico from SVG)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/generate_app_icon.py

      - name: Build PyInstaller ONEDIR app
        run: |
          pyinstaller packaging/courier.spec --noconfirm --distpath dist/windows --workpath build/windows
          if (!(Test-Path "dist/windows/Courier/Courier.exe")) {
            throw "Courier.exe missing from ONEDIR output"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" set "ISCC=C:\Program Files\Inno Setup 6\ISCC.exe"
          "%ISCC%" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\windows\courier.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Courier-Setup-${{ steps.ver.outputs.version }}
          path: dist/windows/Courier-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows/Courier-Setup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
