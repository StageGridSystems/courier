[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courier"
version = "0.1.0"
description = "Courier by StageGrid Systems - send email campaigns from your own Gmail account"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [{ name = "StageGrid Systems" }]
dependencies = [
    "PySide6>=6.6",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.120",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "keyring>=25.0",
    "cryptography>=42.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.3",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
courier = "courier.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
courier = ["resources/**/*", "guide/*.md", "composer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "SIM102"]
